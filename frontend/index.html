<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>电商数据分析 AI 助手</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
:root{
  --brand:#185FA5; --brand-dark:#0C447C; --brand-soft:#E6F1FB; --brand-pill:#EAF2FF;
  --bg:#F5F6F8; --surface:#FFFFFF; --border:#E5E7EB; --border-soft:#EEF0F3;
  --text:#1F2329; --text-2:#6B7280; --text-3:#9CA3AF;
  --ok:#3B6D11; --warn:#92400E; --danger:#A32D2D;
  --r:12px; --r-sm:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI","Microsoft YaHei",Arial,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;font-size:14px}

header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 20px;height:60px;display:flex;align-items:center;gap:12px;flex:none}
.logo{width:30px;height:30px;border-radius:9px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex:none}
.brand{font-size:15px;font-weight:600;line-height:1.2}
.brand small{display:block;font-size:11px;color:var(--text-2);font-weight:400}
.seg{margin-left:auto;display:flex;background:#F1F3F6;border-radius:9px;padding:3px}
.seg button{border:none;background:transparent;padding:6px 14px;border-radius:7px;cursor:pointer;font-size:13px;color:var(--text-2);font-family:inherit;transition:.15s}
.seg button.active{background:var(--surface);color:var(--brand);font-weight:600}
.badge{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2);background:#F7F8FA;border:1px solid var(--border-soft);padding:5px 11px;border-radius:20px;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--text-3);flex:none}
.badge.ok .dot{background:var(--ok)}
.badge.err .dot{background:var(--danger)}

main{flex:1;display:flex;overflow:hidden}
.chat{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--surface);border-right:1px solid var(--border)}
.msgs{flex:1;overflow-y:auto;padding:20px 24px}
.msg{margin-bottom:18px;display:flex;gap:10px}
.msg.user{flex-direction:row-reverse}
.avatar{width:28px;height:28px;border-radius:8px;background:var(--brand-soft);color:var(--brand);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex:none}
.msg.user .avatar{background:var(--brand);color:#fff}
.bubble{max-width:80%;background:#F7F8FA;border:1px solid var(--border-soft);padding:12px 14px;border-radius:14px;border-top-left-radius:4px}
.msg.user .bubble{background:var(--brand);color:#fff;border-color:var(--brand);border-radius:14px;border-top-right-radius:4px;padding:9px 13px}
.bubble .meta{font-size:12px;color:var(--text-2);margin-bottom:7px}
.msg.user .bubble .meta{display:none}
.bubble .answer{line-height:1.65;font-size:14px;white-space:pre-wrap}
.chart{width:100%;height:270px;margin:10px 0}
.chart-reason{font-size:12px;color:#475467;background:#F0F7FF;border-left:3px solid var(--brand);padding:6px 10px;border-radius:0 6px 6px 0;margin:6px 0 10px}
.src{font-size:12px;color:#4C3FA8;background:#F1EEFC;padding:5px 10px;border-radius:6px;margin:4px 0}
.result-table{width:100%;border-collapse:collapse;font-size:12px;margin:8px 0}
.result-table th,.result-table td{border:1px solid var(--border);padding:5px 9px;text-align:left}
.result-table th{background:#F3F4F6;font-weight:600}
details.sqlbox{margin:8px 0}
details.sqlbox summary{cursor:pointer;font-size:12px;color:var(--text-2);background:#F7F8FA;border:1px solid var(--border-soft);padding:6px 11px;border-radius:7px;list-style:none;user-select:none}
details.sqlbox summary::-webkit-details-marker{display:none}
details.sqlbox summary:before{content:"\25B8 ";color:var(--brand)}
details.sqlbox[open] summary:before{content:"\25BE "}
details.sqlbox pre{background:var(--brand-dark);color:#E6F1FB;padding:10px 12px;border-radius:0 0 7px 7px;font-family:Consolas,monospace;font-size:12px;white-space:pre-wrap;word-break:break-all;margin-top:-1px}

.chips{padding:10px 24px;border-top:1px solid var(--border-soft);background:#FCFCFD}
.chips span{display:inline-block;background:var(--brand-pill);color:var(--brand-dark);padding:5px 12px;border-radius:16px;font-size:12px;margin:0 6px 6px 0;cursor:pointer;border:1px solid #D7E6FA;transition:.15s}
.chips span:hover{background:var(--brand-soft);border-color:var(--brand)}
.input-row{display:flex;gap:8px;padding:14px 24px 18px;border-top:1px solid var(--border-soft)}
.field{border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:13px;background:var(--surface);font-family:inherit;color:var(--text);outline:none}
.field:focus{border-color:var(--brand)}
#dataset{max-width:190px;cursor:pointer}
#q{flex:1}
.btn{background:var(--brand);color:#fff;border:none;border-radius:10px;padding:0 22px;cursor:pointer;font-size:14px;font-family:inherit;transition:.15s}
.btn:hover{background:var(--brand-dark)}
.btn:disabled{background:var(--text-3);cursor:default}

.sidebar{width:360px;flex:none;overflow-y:auto;background:#FBFCFD;padding:16px}
.panel{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--r);padding:14px;margin-bottom:14px}
.panel h3{font-size:13px;font-weight:600;margin-bottom:10px;color:var(--text)}
.tabs{display:flex;gap:16px;border-bottom:1px solid var(--border);margin-bottom:14px}
.tab{border:none;background:none;padding:8px 2px;font-size:13px;color:var(--text-2);cursor:pointer;font-family:inherit;position:relative}
.tab.active{color:var(--brand);font-weight:600}
.tab.active:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--brand);border-radius:2px}
.tabpane[hidden]{display:none}
.up{display:inline-block;border:1px dashed var(--border);border-radius:9px;padding:7px 12px;font-size:12px;color:var(--text-2);cursor:pointer;background:#FCFCFD}
.up:hover{border-color:var(--brand);color:var(--brand)}
.fname{font-size:12px;color:var(--text-3);margin-left:8px}
.btn-sm{border:1px solid var(--border);background:var(--surface);padding:6px 12px;border-radius:8px;cursor:pointer;font-size:12px;font-family:inherit;color:var(--text-2);margin:4px 6px 4px 0}
.btn-sm.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn-sm.primary:hover{background:var(--brand-dark)}
.ds-item{display:flex;align-items:center;gap:8px;font-size:13px;padding:8px 6px;border-bottom:1px dashed var(--border-soft);border-radius:7px}
.ds-item:last-child{border-bottom:none}
.ds-item:hover{background:#F7F9FC}
.ds-ic{width:20px;height:20px;border-radius:6px;background:var(--brand-soft);display:flex;align-items:center;justify-content:center;flex:none}
.ds-rows{margin-left:auto;background:#F1EFE8;color:#5F5E5A;border-radius:10px;padding:1px 8px;font-size:11px}
.ds-del{border:none;background:none;color:var(--danger);font-size:12px;cursor:pointer;font-family:inherit;opacity:0;transition:.15s}
.ds-item:hover .ds-del{opacity:1}
.empty{font-size:12px;color:var(--text-3);padding:14px 8px;text-align:center;line-height:1.7}
.alert-box{font-size:12px;color:var(--warn);background:#FAEEDA;padding:9px 11px;border-radius:8px;margin:6px 0;line-height:1.6}
.alert-box button{border:1px solid #EF9F27;background:#fff;color:var(--warn);border-radius:6px;padding:3px 9px;font-size:11px;cursor:pointer;margin-top:6px;font-family:inherit}
.clarify-box{margin:8px 0}
.clarify-opt{display:inline-block;background:var(--brand-pill);color:var(--brand-dark);padding:7px 14px;border-radius:18px;font-size:13px;margin:5px 8px 0 0;cursor:pointer;border:1px solid #CFE0F7}
.clarify-opt:hover{background:var(--brand-soft)}
.hint{font-size:12px;color:var(--text-2);margin-bottom:8px}
select.field{appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M1 1l4 4 4-4' fill='none' stroke='%236B7280' stroke-width='1.5'/></svg>");background-repeat:no-repeat;background-position:right 10px center;padding-right:28px}

.sk-wrap{display:flex;flex-direction:column;gap:8px;padding:4px 0}
.sk{height:12px;border-radius:6px;background:#EEF0F3;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
@media (max-width:900px){.sidebar{width:300px}}
</style>
</head>
<body>
<header>
  <div class="logo">AI</div>
  <div class="brand">电商数据分析助手<small>商品浏览 · 销售转化 · 流量来源</small></div>
  <div class="seg">
    <button class="active" data-mode="auto">自动</button>
    <button data-mode="analysis">分析</button>
    <button data-mode="knowledge">知识库</button>
  </div>
  <div class="badge" id="status"><span class="dot"></span><span id="status-text">正在连接后端…</span></div>
</header>
<main>
  <div class="chat">
    <div class="msgs" id="msgs">
      <div class="msg"><div class="avatar">AI</div><div class="bubble"><div class="answer">你好！我是你的店商数据分析助手，已接入「抖音店铺商品浏览销售数据」。试试问我：销售额最高的商品有哪些？各流量来源的 GMV 对比，或哪款商品退款率偏高。</div></div></div>
    </div>
    <div class="chips">
      <span onclick="fill('销售额最高的前 10 个商品是哪些？','抖音女装店铺_商品浏览销售数据表')">销售额 TOP10</span>
      <span onclick="fill('按主要流量来源统计成交金额并对比','抖音女装店铺_商品浏览销售数据表')">各流量来源 GMV</span>
      <span onclick="fill('退款率最高的 10 个商品有哪些？','抖音女装店铺_商品浏览销售数据表')">退款率异常商品</span>
      <span onclick="fill('支付转化率最高的商品是哪些？','抖音女装店铺_商品浏览销售数据表')">转化率排行</span>
      <span onclick="fill('点击率最高但转化率偏低的商品有哪些？','抖音女装店铺_商品浏览销售数据表')">高点击低转化</span>
    </div>
    <div class="input-row">
      <select class="field" id="dataset" title="选择分析的数据集" onchange="refreshAlertControls()">
        <option value="">自动（全部表）</option>
      </select>
      <input class="field" id="q" placeholder="输入你的问题..." onkeydown="if(event.key==='Enter')send()" />
      <button class="btn" id="sendbtn" onclick="send()">发送</button>
    </div>
  </div>
  <div class="sidebar">
    <div class="tabs">
      <button class="tab active" data-tab="data">数据管理</button>
      <button class="tab" data-tab="exec">执行详情</button>
      <button class="tab" data-tab="alert">智能预警</button>
    </div>

    <div class="tabpane" id="pane-data">
      <div class="panel">
        <h3>上传结构化数据</h3>
        <label class="up"><input type="file" id="csvfile" accept=".csv,.xlsx,.xls" hidden onchange="showName('csv')"><span>选择 CSV / Excel</span></label>
        <span class="fname" id="csvname">未选择文件</span>
        <div style="margin-top:8px"><button class="btn-sm primary" onclick="uploadData()">导入数据</button></div>
      </div>
      <div class="panel">
        <h3>上传知识文档</h3>
        <label class="up"><input type="file" id="docfile" accept=".txt,.md,.csv,.pdf,.docx" hidden onchange="showName('doc')"><span>选择 PDF / Word / TXT</span></label>
        <span class="fname" id="docname">未选择文件</span>
        <div style="margin-top:8px"><button class="btn-sm primary" onclick="uploadDoc()">索引文档</button></div>
      </div>
      <div class="panel">
        <h3>数据集</h3>
        <div id="dslist"><div class="empty">加载中…</div></div>
        <div style="margin-top:10px"><button class="btn-sm" onclick="loadDatasets()">刷新数据集</button><button class="btn-sm" onclick="reindex()">重建知识索引</button></div>
      </div>
      <div class="panel">
        <h3>知识库检索范围</h3>
        <select class="field" id="kbScope" style="width:100%;padding:7px 9px;font-size:12px">
          <option value="">全部（不隔离）</option>
          <option value="bandao">半岛医疗产品</option>
          <option value="apparel">电商示例语料</option>
        </select>
        <div class="hint" style="margin:8px 0 0">限定范围可避免不相关文档混入答案</div>
      </div>
    </div>

    <div class="tabpane" id="pane-exec" hidden>
      <div class="panel">
        <h3>本次执行</h3>
        <div id="inspect"><div class="empty">尚无执行</div></div>
      </div>
    </div>

    <div class="tabpane" id="pane-alert" hidden>
      <div class="panel">
        <h3>智能预警（自适应）</h3>
        <div class="hint">扫描对象：<b id="alertTarget">—</b><br>监测模式：<b id="monitoring">—</b></div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px">
          <select class="field" id="alertTimeCol" title="时间列（留空=自动识别）" style="padding:6px 8px;font-size:12px"><option value="">时间列：自动</option></select>
          <select class="field" id="alertSens" title="灵敏度" style="padding:6px 8px;font-size:12px">
            <option value="conservative">保守</option>
            <option value="standard" selected>标准</option>
            <option value="sensitive">高灵敏</option>
          </select>
        </div>
        <button class="btn-sm primary" onclick="runAlert()">扫描预警</button>
        <div id="alertout"></div>
      </div>
    </div>
  </div>
</main>

<script>
let mode = "auto";
document.querySelectorAll(".seg button").forEach(b => b.onclick = () => {
  document.querySelectorAll(".seg button").forEach(x => x.classList.remove("active"));
  b.classList.add("active");
  mode = b.dataset.mode;
});
document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
  t.classList.add("active");
  ["data","exec","alert"].forEach(p => { document.getElementById("pane-"+p).hidden = (p !== t.dataset.tab); });
});

function fill(t, ds) {
  document.getElementById("q").value = t;
  // 快捷问题可顺带锁定数据集，避免「自动（全部表）」下的跨表歧义
  if (ds) {
    document.getElementById("dataset").value = ds;
    refreshAlertControls();
  }
}
function showName(kind) {
  const f = document.getElementById(kind + "file").files[0];
  document.getElementById(kind + "name").textContent = f ? f.name : "未选择文件";
}
function setStatus(text, ok) {
  const b = document.getElementById("status");
  b.className = "badge" + (ok === true ? " ok" : ok === false ? " err" : "");
  document.getElementById("status-text").textContent = text;
}
function addMsg(cls, html) {
  const d = document.createElement("div");
  d.className = "msg " + cls;
  d.innerHTML = cls === "ai"
    ? `<div class="avatar">AI</div><div class="bubble">${html}</div>`
    : `<div class="bubble">${html}</div><div class="avatar">我</div>`;
  document.getElementById("msgs").appendChild(d);
  document.getElementById("msgs").scrollTop = 1e9;
  return d.querySelector(".bubble");
}

async function send() {
  const q = document.getElementById("q").value.trim();
  if (!q) return;
  addMsg("user", escapeHtml(q));
  document.getElementById("q").value = "";
  const btn = document.getElementById("sendbtn"); btn.disabled = true;
  const loading = addMsg("ai", `<div class="sk-wrap"><div class="sk" style="width:55%"></div><div class="sk" style="width:88%"></div><div class="sk" style="width:70%"></div></div>`);
  try {
    await streamChat(q, loading);
  } catch (e) {
    loading.innerHTML = `<div class="answer" style="color:#b91c1c">请求失败，请稍后重试</div>`;
  }
  btn.disabled = false;
}

async function streamChat(q, loading) {
  const resp = { route: "", sql: "", columns: [], rows: [], chart: null, answer: "", sources: [], clarification: [] };
  let answerEl = null;
  const render = () => {
    loading.innerHTML = renderAgent(resp);
    loading.querySelectorAll("[data-chart]").forEach(el => {
      try { echarts.init(el).setOption(JSON.parse(el.dataset.chart)); } catch(e){}
    });
    answerEl = loading.querySelector(".answer");
    renderInspect(resp);
  };
  const r = await fetch("/api/v1/chat", {
    method: "POST", headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ question: q, mode, dataset: document.getElementById("dataset").value,
                           domain: (document.getElementById("kbScope") || {}).value || "" }),
    cache: "no-store",
  });
  if (!r.ok || !r.body) {
    loading.innerHTML = `<div class="answer" style="color:#b91c1c">服务暂不可用（${r.status}）</div>`;
    return;
  }
  const reader = r.body.getReader();
  const decoder = new TextDecoder();
  let buf = "";
  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });
    const blocks = buf.split("\n\n");
    buf = blocks.pop();
    for (const block of blocks) {
      const line = block.split("\n").find(l => l.startsWith("data:"));
      if (!line) continue;
      let ev;
      try { ev = JSON.parse(line.slice(5).trim()); } catch (e) { continue; }
      if (ev.type === "route") { resp.route = ev.route; render(); }
      else if (ev.type === "sql") { resp.sql = ev.sql; render(); }
      else if (ev.type === "rows") { resp.columns = ev.columns || []; resp.rows = ev.rows || []; render(); }
      else if (ev.type === "chart") { resp.chart = ev.chart; render(); }
      else if (ev.type === "answer") { resp.answer = ev.text || ""; render(); }
      else if (ev.type === "clarify") { resp.route = "clarify"; resp.answer = ev.message; resp.clarification = ev.options || []; render(); }
      else if (ev.type === "answer_start") { resp.answer = ""; if (!answerEl) render(); else answerEl.textContent = ""; }
      else if (ev.type === "answer_delta") {
        resp.answer += ev.text || "";
        if (!answerEl) render();
        else answerEl.textContent = resp.answer;
      }
      else if (ev.type === "done") { Object.assign(resp, ev.response); renderInspect(resp); }
      else if (ev.type === "error") {
        loading.innerHTML = `<div class="answer" style="color:#b91c1c">${escapeHtml(ev.message || "服务内部错误，请稍后重试")}</div>`;
        return;
      }
    }
  }
}

function renderAgent(j) {
  let h = `<div class="meta">${j.route}${j.elapsed_ms ? " · " + j.elapsed_ms + "ms" : ""}</div>`;
  if (j.clarification && j.clarification.length) {
    _clarifyOpts = j.clarification;
    h += `<div class="answer">${escapeHtml(j.answer||"")}</div>`;
    h += `<div class="clarify-box">` + j.clarification.map((o,i)=>
      `<span class="clarify-opt" onclick="chooseClarify(${i})">${escapeHtml(o.label)}</span>`).join("") + `</div>`;
    return h;
  }
  if (j.sql) h += `<details class="sqlbox"><summary>查看生成的 SQL</summary><pre>${escapeHtml(j.sql)}</pre></details>`;
  if (j.chart && j.chart.option) h += `<div class="chart" data-chart='${escapeAttr(JSON.stringify(j.chart.option))}'></div>`;
  if (j.chart && j.chart.reason) h += `<div class="chart-reason">选图理由：${escapeHtml(j.chart.reason)}</div>`;
  if (j.rows && j.rows.length) h += tableHtml(j.columns, j.rows.slice(0, 50));
  h += `<div class="answer">${escapeHtml(j.answer||"")}</div>`;
  if (j.sources && j.sources.length) h += j.sources.map(s=>`<div class="src">来源：${escapeHtml(s)}</div>`).join("");
  return h;
}

function renderKnowledge(j) {
  const items = (j.results||[]);
  if (!items.length) return `<div class="answer">知识库暂无相关内容。</div>`;
  return items.map((i,idx)=>{
    const t = String(i.text||"");
    const shown = t.length > 220 ? t.slice(0, 220) + "……（已截断）" : t;
    return `<div class="src">${idx+1}. ${escapeHtml(i.source)}</div><div class="answer" style="margin-bottom:8px">${escapeHtml(shown)}</div>`;
  }).join("");
}

function tableHtml(cols, rows) {
  let h = `<table class="result-table"><tr>${cols.map(c=>`<th>${escapeHtml(c)}</th>`).join("")}</tr>`;
  rows.forEach(r => { h += `<tr>${cols.map(c=>`<td>${escapeHtml(String(r[c]??""))}</td>`).join("")}</tr>`; });
  return h + "</table>";
}

function renderInspect(j) {
  let h = "";
  if (j.route) h += `<div class="hint">路由：<b>${j.route}</b>${j.elapsed_ms?` · ${j.elapsed_ms}ms`:""}</div>`;
  if (j.sql) h += `<details class="sqlbox" open><summary>生成的 SQL</summary><pre>${escapeHtml(j.sql)}</pre></details>`;
  if (j.sources && j.sources.length) h += j.sources.map(s=>`<div class="src">${escapeHtml(s)}</div>`).join("");
  document.getElementById("inspect").innerHTML = h || `<div class="empty">尚无执行</div>`;
}

async function uploadData() {
  const f = document.getElementById("csvfile").files[0];
  if (!f) return alert("请选择文件");
  const fd = new FormData(); fd.append("file", f);
  const r = await fetch("/api/v1/data/upload", { method:"POST", body: fd });
  const j = await r.json();
  if (j.success) {
    alert(`导入成功：${j.dataset.name}（${j.dataset.rows} 行）`);
    await loadDatasetOptions();
    document.getElementById("dataset").value = j.dataset.name;
    refreshAlertControls();
  } else {
    alert(`失败：${j.message}`);
  }
  loadDatasets();
}
async function uploadDoc() {
  const f = document.getElementById("docfile").files[0];
  if (!f) return alert("请选择文件");
  const fd = new FormData(); fd.append("file", f);
  const r = await fetch("/api/v1/knowledge/upload", { method:"POST", body: fd });
  const j = await r.json();
  alert(j.success ? `索引成功：${j.source}（${j.chunks} 片段）` : `失败：${j.detail||JSON.stringify(j)}`);
}

const _TABLE_ICON = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#185FA5" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>`;
async function loadDatasets() {
  const el = document.getElementById("dslist");
  try {
    const r = await fetch("/api/v1/datasets");
    const j = await r.json();
    const list = j || [];
    el.innerHTML = list.length
      ? list.map(d=>`<div class="ds-item"><span class="ds-ic">${_TABLE_ICON}</span><span>${escapeHtml(d.name)}</span><span class="ds-rows">${d.rows} 行</span><button class="ds-del" onclick="delDs('${escapeAttr(d.name)}')">删除</button></div>`).join("")
      : `<div class="empty">暂无数据集<br/>先在上方上传一份 CSV / Excel</div>`;
  } catch (e) {
    el.innerHTML = `<div class="empty">加载失败，请确认后端已启动<br/>然后点击「刷新数据集」</div>`;
  }
}
async function loadDatasetOptions() {
  const sel = document.getElementById("dataset");
  if (!sel) return;
  try {
    const r = await fetch("/api/v1/datasets");
    const j = await r.json();
    const names = (j || []).map(d => d.name);
    sel.innerHTML = `<option value="">自动（全部表）</option>` +
      names.map(n => `<option value="${escapeAttr(n)}">${escapeHtml(n)}</option>`).join("");
  } catch (e) { /* 保持默认选项 */ }
}

async function delDs(n) {
  if (!confirm(`删除表 ${n}？（仅删除库内数据，磁盘原文件保留）`)) return;
  await fetch(`/api/v1/datasets/${n}`, { method:"DELETE" });
  await loadDatasetOptions();
  loadDatasets();
}
async function reindex() {
  const r = await fetch("/api/v1/knowledge/reindex", { method:"POST" });
  const j = await r.json();
  alert(`已索引 ${j.indexed_docs} 篇文档`);
}
async function refreshAlertControls() {
  const ds = document.getElementById("dataset").value;
  const mon = document.getElementById("monitoring");
  const tgt = document.getElementById("alertTarget");
  if (!ds) { tgt.textContent = "未选择（将自动取第一张表）"; mon.textContent = "—"; return; }
  try {
    const r = await fetch(`/api/v1/alerts/profile?dataset=${encodeURIComponent(ds)}`);
    const j = await r.json();
    tgt.textContent = j.dataset || ds;
    if (!j.ok) { mon.textContent = "不可用"; return; }
    mon.textContent = j.monitoring + `（指标：${(j.metrics||[]).join("、")||"无"}）`;
    const cur = document.getElementById("alertTimeCol").value;
    document.getElementById("alertTimeCol").innerHTML =
      `<option value="">时间列：自动</option>` +
      (j.time_col ? `<option value="${escapeAttr(j.time_col)}">${escapeHtml(j.time_col)}</option>` : "");
    document.getElementById("alertTimeCol").value = cur;
  } catch (e) { /* 忽略 */ }
}

async function runAlert() {
  const body = {
    dataset: document.getElementById("dataset").value,
    sensitivity: document.getElementById("alertSens").value,
    time_col: document.getElementById("alertTimeCol").value || null,
  };
  const r = await fetch("/api/v1/alerts/scan", {
    method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify(body),
  });
  const j = await r.json();
  let h = "";
  if (j.dataset) h += `<div class="hint">扫描对象：<b>${escapeHtml(j.dataset)}</b>${j.monitoring ? " · " + escapeHtml(j.monitoring) : ""}</div>`;
  if (j.notes && j.notes.length) h += j.notes.map(n=>`<div class="alert-box">${escapeHtml(n)}</div>`).join("");
  const items = j.anomalies || [];
  if (!items.length) {
    h += `<div class="alert-box">${escapeHtml(j.advice||"暂未发现异常")}</div>`;
  } else {
    _drills = items.map(a => a.drill_question || "");
    h += items.map((a, i) => {
      const color = a.level === "P0" ? "#b91c1c" : a.level === "P1" ? "#b45309" : "#92400e";
      return `<div class="alert-box" style="border-left:3px solid ${color}">
        <b style="color:${color}">[${a.level}]</b> ${escapeHtml(a.dimension||"整体")} · ${escapeHtml(a.metric)}<br/>
        ${escapeHtml(a.message)}<br/>
        <span style="color:#6b7280">偏离：${escapeHtml(a.deviation)} · 模式：${escapeHtml(a.mode)} · 置信：${escapeHtml(a.confidence)}</span><br/>
        <button onclick="drill(${i})">深入归因</button>
      </div>`;
    }).join("");
    h += `<div class="alert-box">建议：${escapeHtml(j.advice||"")}</div>`;
  }
  document.getElementById("alertout").innerHTML = h;
}

let _drills = [];
function drill(i) {
  const q = _drills[i];
  if (!q) return;
  document.getElementById("q").value = q;
  send();
}
let _clarifyOpts = [];
function chooseClarify(i) {
  const o = _clarifyOpts[i];
  if (!o) return;
  document.getElementById("q").value = o.question;
  send();
}

function escapeHtml(s){return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
function escapeAttr(s){return String(s).replace(/'/g,"&#39;");}

async function loadHealth(retry) {
  try {
    const r = await fetch("/api/v1/health");
    const j = await r.json();
    setStatus(`后端已连接 · ${j.llm_provider}${j.llm_configured ? "(已配置)" : "(Mock)"}`, true);
  } catch (e) {
    if (retry) { setStatus("正在连接后端…", null); setTimeout(() => loadHealth(false), 2500); }
    else setStatus("后端未就绪，请刷新页面", false);
  }
}
loadHealth(true);
loadDatasets();
loadDatasetOptions();
refreshAlertControls();
</script>
